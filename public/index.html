<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#16181d;--mut:#6b7280;--ac:#ff6900;--act:#c94f00;--bd:#e7e9ee;--ok:#0a7d44;--onac:#fff;--field:#fff;--scrim:#0008;--rd:#e4002b;--pc:#ffc400;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Noto Sans TC",monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e10;--card:#17181b;--tx:#f2f3f5;--mut:#9aa0aa;--ac:#ff7a1f;--act:#ff8a3d;--bd:#2a2c31;--ok:#3ddc84;--onac:#1a0f05;--field:#25272b;--rd:#ff5468;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e10;--card:#17181b;--tx:#f2f3f5;--mut:#9aa0aa;--ac:#ff7a1f;--act:#ff8a3d;--bd:#2a2c31;--ok:#3ddc84;--onac:#1a0f05;--field:#25272b;--rd:#ff5468;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",Inter,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ac);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:var(--onac);padding:14px max(16px,env(safe-area-inset-left,0px)) 14px max(16px,env(safe-area-inset-right,0px));margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1px,transparent 0) 0 0/14px 14px,linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#ff3d00))}
.top{display:flex;align-items:center;gap:12px}
.logo{flex:none;width:38px;height:38px;border-radius:30%;background:var(--onac);color:var(--ac);display:grid;place-items:center;font-weight:900;font-size:19px}
.ttl{flex:1;min-width:0}
h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:.02em}
.sub{font-family:var(--mono);font-size:11px;opacity:.88;margin-top:3px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upd{flex:none;background:var(--onac);color:var(--ac);border:0;border-radius:12px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.04em}
#upd[disabled]{opacity:.6}
#q{width:100%;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;font-size:16px;background:var(--field);color:var(--tx);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.seg{display:flex;gap:4px;margin:10px 0 0;padding:4px;border:1px solid var(--bd);border-radius:14px;background:var(--card);max-width:720px;margin-inline:auto}
.seg button{flex:1;min-width:0;border:0;background:none;color:var(--mut);font:700 13px/1 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:10px 4px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button i{width:8px;height:8px;border-radius:2px;flex:none}
.seg button em{font:600 11px var(--mono);font-style:normal;opacity:.7}
.seg button.on{background:var(--tx);color:var(--bg)}
.seg i.mi{background:var(--ac)}.seg i.redmi{background:var(--rd)}.seg i.poco{background:var(--pc)}.seg i.other{background:var(--mut)}
main{padding:4px 0 48px;max-width:720px;margin:0 auto}
.sec{display:flex;align-items:center;gap:8px;margin:24px 0 2px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.sec:first-child{margin-top:14px}
.sec::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--mut)}
.sec.mi::before{background:var(--ac)}.sec.redmi::before{background:var(--rd)}.sec.poco::before{background:var(--pc)}
.sec b{color:var(--tx);font-size:14px;letter-spacing:.04em;text-transform:none}
.sec .n{margin-left:auto;font-family:var(--mono);letter-spacing:0}
.card{display:flex;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin:10px 0;border:1px solid var(--bd);cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ac)}.card:active{transform:scale(.995)}
.pic{flex:none;width:72px;height:72px;border-radius:14px;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--mut) 22%,transparent) 1px,transparent 0) 0 0/9px 9px,var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain}
.card>div:last-child{min-width:0;flex:1}
.nm{font-weight:700;word-break:break-word;line-height:1.35}
.cat{font-size:12px;color:var(--mut);margin-top:1px}
.bb{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-weight:700;color:var(--tx)}.bb::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--mut)}
.bb.mi::before{background:var(--ac)}.bb.redmi::before{background:var(--rd)}.bb.poco::before{background:var(--pc)}
.w{color:var(--ok);font:800 19px/1.3 var(--mono);margin-top:4px}.w.none{color:var(--mut)}
.nt{font-size:12.5px;color:var(--mut);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--act);color:var(--act);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
.tag.muted{border-color:var(--mut);color:var(--mut)}.tag.live{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.cp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.cp.lg{margin:12px 0}.cpl{font-size:12px;font-weight:700;color:var(--act);width:100%}.cpc{font-size:12px;border:1px solid var(--bd);border-radius:8px;padding:1px 9px;background:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:48px 0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;display:none;z-index:20}
#sheet{position:fixed;inset:0;background:var(--scrim);display:none;z-index:30;align-items:flex-end}
#sheet.on{display:flex}
.pane{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.pane h2{margin:0 0 6px;font-size:19px}.pane h3{font-size:13px;margin:18px 0 4px;letter-spacing:.06em;color:var(--mut)}
.pane li{font-size:14px;margin:3px 0}.pane a{color:var(--act)}
.big{font:800 28px var(--mono);color:var(--ok)}
.x{float:right;border:0;background:var(--bg);color:var(--tx);border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer}
.tiers{margin-top:8px;display:grid;gap:6px}
.trow{border:1px solid var(--bd);border-radius:12px;padding:7px 11px}
.trow.hl{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.trow.dim{opacity:.62}
.tl{font-size:12px;color:var(--mut)}
.tv{font:800 15px var(--mono);word-break:break-word}.trow.hl .tv{color:var(--ok)}
.tc{font-size:12px;color:var(--mut);margin-top:1px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border:1px solid var(--mut);color:var(--mut);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.pill.live{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.big+.tiers,.tiers.lg .tv{font-size:18px}
.rvt{font-weight:800;font-size:18px;margin:6px 2px 10px}.rvt small{display:block;font-weight:500;font-size:12px;color:var(--mut);margin-top:2px}
.rv{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rv h3{margin:0;font-size:15px}.rv h3 em{font-style:normal;background:var(--ac);color:var(--onac);border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
.rvh{margin:4px 0 8px;font-size:12px;color:var(--mut)}.rvi{padding:8px 0;border-top:1px solid var(--bd);font-size:13px}.rvi:first-of-type{border-top:0}
.rvi b{display:block}.rvi span{display:block;color:var(--mut);margin-top:2px;line-height:1.5}.rve{font-size:13px;color:var(--mut);padding:4px 0}
.chip .cn{font-style:normal;background:var(--ac);color:var(--onac);border-radius:999px;padding:0 6px;font-size:11px;margin-left:2px}
.chip.on .cn{background:var(--onac);color:var(--act)}
</style>
</head>
<body>
<header>
  <div class="top"><span class="logo" aria-hidden="true">保</span><div class="ttl"><h1>小米保固查詢</h1><div class="sub" id="meta">載入中…</div></div><button id="upd">↻ 更新</button></div>
  <input id="q" type="search" placeholder="輸入產品名稱,例如:Xiaomi 17、Redmi Buds" autocomplete="off">
</header>
<div class="chips" id="chips"></div>
<div class="seg" id="seg" hidden></div>
<main id="list"></main>
<div id="toast"></div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
let D=null,cat='all';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[\s\-_\/()()]/g,'');
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}

/* ---------- Google 試算表(主要資料來源;官網資料為輔) ---------- */
function parseCsv(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let k=0;k<t.length;k++){const c=t[k];
    if(q){if(c==='"'){if(t[k+1]==='"'){f+='"';k++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[k+1]==='\n')k++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows}
const gviz=(id,q)=>`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&${q}`;
const DEF_TABS=['手機平板','耳機喇叭','手錶手環','電視螢幕投影','網路攝影機','智慧家庭','充電配件','清潔電器','廚房電器','空氣洗衣家電','個人護理旅行','生活週邊'];
async function fetchCsv(u,dbg,tag){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
  try{const r=await fetch(u+'&_='+Date.now(),{cache:'no-store',signal:ctl.signal});if(!r.ok){dbg&&dbg.push(tag+': HTTP '+r.status);return null}return await r.text()}catch(e){dbg&&dbg.push(tag+': '+(e&&e.name==='AbortError'?'逾時':'連線被擋/失敗'));return null}finally{clearTimeout(tm)}}
// 找到含「產品名稱」的那一列當標題列,其後才是資料
function toRows(t){const all=parseCsv(t);const i=all.findIndex(r=>r.some(c=>(c||'').trim()==='產品名稱'));return i<0?null:all.slice(i)}
// 讀「目錄」分頁列出的所有分頁;讀不到「目錄」時用內建的 12 個分類分頁
async function getSheetRows(){
  const dbg=[];
  if(typeof window!=='undefined'&&window.__SHEET_CSV!==undefined)return{rows:parseCsv(window.__SHEET_CSV),from:'demo',failed:0,dbg};
  let url='',cfgTabs=null;try{const r=await fetch('config.json',{cache:'no-cache'});if(r.ok){const c=await r.json();url=(c.sheetUrl||'').trim();if(Array.isArray(c.tabs)&&c.tabs.length)cfgTabs=c.tabs}}catch{}
  if(!url)return{rows:null,from:'none',failed:0,dbg};
  const fail=()=>{try{const c=JSON.parse(localStorage.getItem('sheetCache')||'null');if(c)return{rows:c,from:'cache',failed:0,dbg}}catch{}return{rows:null,from:'fail',failed:0,dbg}};
  if(/[?&]output=csv/.test(url)||/gviz\/tq/.test(url)){const t=await fetchCsv(url+(url.includes('?')?'':'?'),dbg,'單頁');const r=t&&toRows(t);return r?{rows:r,from:'live',failed:0,dbg}:fail()}
  const id=(url.match(/\/d\/(?:e\/)?([\w-]+)/)||[])[1];if(!id)return fail();
  const tabUrl=n=>gviz(id,'headers=1&sheet='+encodeURIComponent(n));
  let tabs=[];
  const dir=await fetchCsv(gviz(id,'headers=1&sheet='+encodeURIComponent('目錄')),null,'目錄');
  if(dir){tabs=parseCsv(dir).map(r=>(r[0]||'').trim()).filter(x=>x&&!/^(分頁名稱|分頁|說明|目錄)$/.test(x));}
  if(!tabs.length)tabs=cfgTabs||DEF_TABS;
  tabs=[...new Set(tabs)];
  // 一次讀 3 個分頁,失敗的重試一次(手機網路同時開太多連線容易被丟掉)
  const res=new Array(tabs.length).fill(null);let next=0;
  const one=async i=>{for(let k=0;k<2&&!res[i];k++){const t=await fetchCsv(tabUrl(tabs[i]),k?dbg:null,tabs[i]);if(t){const r=toRows(t);if(r)res[i]=r;else if(k)dbg.push(tabs[i]+': 沒有「產品名稱」欄')}}};
  await Promise.all([0,1,2].map(async()=>{while(next<tabs.length){const i=next++;await one(i)}}));
  const good=res.filter(Boolean);
  let rows=null;const failed=res.length-good.length;
  if(good.length){rows=[good[0][0]];good.forEach(g=>g.slice(1).forEach(r=>{if(r.some(c=>(c||'').trim()))rows.push(r)}))}
  else{
    const gid=(url.match(/[#&?]gid=(\d+)/)||[])[1]||'0';
    for(const u of [gviz(id,'headers=1&gid='+gid),`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`]){const t=await fetchCsv(u.includes('?')?u:u+'?',dbg,'gid'+gid);const r=t&&toRows(t);if(r){rows=r;break}}
  }
  if(!rows)return fail();
  try{localStorage.setItem('sheetCache',JSON.stringify(rows))}catch{}
  return{rows,from:'live',failed,dbg,tabs:tabs.length}}
const monthsFrom=w=>{w=w||'';if(/無保|不保/.test(w))return 0;let m=w.match(/(\d+)\s*年/);if(m)return+m[1]*12;m=w.match(/(\d+)\s*個?月/);if(m)return+m[1];if(/半年/.test(w))return 6;return null};
function sheetParts(txt,ex){const px=ex===true?'以換代修':ex===false?'維修':'';
  return txt.split(/[|｜\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const m=x.match(/^(.+?)\s*[=＝:：]\s*(.+?)(?:\s*[@＠]\s*([^#＃]+?))?(?:\s*[#＃]\s*(.+))?$/);if(!m)return null;
    const r=rowOf(m[1].trim(),m[2].trim(),m[4]!==undefined?m[4].trim():px);
    if(m[3])r.pills=[r.pill,/不保|無保/.test(r.value)?'':m[3].trim()].filter(Boolean);return r}).filter(Boolean)}
function parsePx(px){const whole=[],part=[];(px||'').split(/[|｜、,，\n]+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const m=x.match(/^(.*?)\s*(以換代修|維修)$/);if(!m)return;const t=m[1].trim().replace(/[:：=＝]$/,'');if(t)part.push([t,m[2]]);else whole.push(m[2])});return{whole:whole[0]||'',part}}
function applyPxRows(it,pp){if(!it.tiers||it.tiers.kind!=='parts')return;
  const setP=(r,v)=>{r.pill=v;if(r.pills)r.pills=[v,...r.pills.filter(x=>x&&x!==v)]};
  if(pp.whole)it.tiers.rows.forEach(r=>{if(!r.pill&&r.cls!=='dim')setP(r,pp.whole)});
  pp.part.forEach(([t,v])=>it.tiers.rows.forEach(r=>{const l=r.label||'';if(!r.pill&&r.cls!=='dim'&&(l.includes(t)||t.includes(l)))setP(r,v)}))}
function applySheet(rows){
  if(!rows||rows.length<2)return 0;
  const H=rows[0].map(h=>h.trim()),col=n=>H.findIndex(h=>h.startsWith(n));
  const C={cat:col('類別'),brand:col('品牌'),name:col('產品名稱'),w:col('保固期限'),px:col('保固方式'),parts:col('分項'),note:col('備註'),compat:col('相容'),img:col('圖片'),st:col('狀態'),src:col('資料來源')};
  if(C.name<0)return 0;
  const g=(r,k)=>C[k]>=0?(r[C[k]]||'').trim():'';
  let n=0;const SUP=new Set([...(D.groups||[]).map(x=>x.name),...(D.hide||[]).map(x=>x.name),...(D.retired||[])].map(norm));
  rows.slice(1).forEach(r=>{const name=g(r,'name');if(!name)return;
    const key=norm(name),cat=g(r,'cat');
    let it=D.flat.find(i=>!i.vipOnly&&norm(i.name)===key&&(!cat||i.cat===cat))||D.flat.find(i=>!i.vipOnly&&norm(i.name)===key);
    const hide=false; // 已取消表格的隱藏機制:不讀「狀態」欄
    if(!it){
      if(hide||SUP.has(key))return;
      let c=D.categories.find(x=>x.category===cat)||D.categories.find(x=>cat&&(x.category.includes(cat)||cat.includes(x.category)));
      if(!c){c={category:cat||'其他',slug:'sheet-'+(cat||'其他'),icon:'📦',items:[],returnPolicy:[],exclusions:[],url:''};D.categories.push(c)}
      it={name,warranty:'',months:null,exchange:null,note:'',image:'',cat:c.category,icon:c.icon,slug:c.slug,key,sheet:true,supp:true};D.flat.push(it)}
    n++;it.sheetRow=true;
    if(hide){it.hidden=true;return}
    const w=g(r,'w'),px=g(r,'px'),note=g(r,'note'),parts=g(r,'parts'),img=g(r,'img'),cp=g(r,'compat'),src=g(r,'src'),br=g(r,'brand');
    if(!it.extra&&!it.sheet){
      // 官網資料優先:表格只能補照片/相容型號/品牌;保固內容不同時只記錄在「每月檢查」
      const df=[];
      const sib=D.flat.filter(i=>!i.vipOnly&&!i.extra&&!i.sheet&&norm(i.name)===key);
      if(w&&!sib.some(i=>norm(w)===norm(i.warranty||'')))df.push(['保固期限',w,it.warranty||'']);
      if(note&&!sib.some(i=>norm(note)===norm(i.note||'')))df.push(['備註',note,it.note||'']);
      if(parts){const sg=x=>x.map(y=>norm(y.label)+'='+norm(y.value)).join('|');
        const sp=sg(sheetParts(parts,it.exchange)),op=it.tiers&&it.tiers.kind==='parts'?sg(it.tiers.rows):'';
        if(sp!==op)df.push(['分項保固',parts,it.tiers&&it.tiers.kind==='parts'?it.tiers.rows.map(y=>y.label+'='+y.value).join('｜'):'(官網無分項)'])}
      if(df.length)D.review.conflicts.push({name:it.name,cat:it.cat,diffs:df});
      else if(/推定|待確認|已確認/.test(src))D.review.covered.push({name:it.name,cat:it.cat,from:'表格'});
      if(img&&!it.image)it.image=img;
      if(cp)it.compat=cp.split(/[|｜]/).map(x=>x.trim()).filter(Boolean);
      if(br)it.brand=br;
      {const pp=parsePx(px);if(pp.whole&&it.exchange==null)it.exchange=pp.whole==='以換代修';applyPxRows(it,pp)}
      return}
    // 官網沒有的產品(補充項目):以表格為準
    const chg=(w&&w!==it.warranty)||(note&&note!==it.note);
    if(w){it.warranty=w;it.months=monthsFrom(w)}
    const pp=parsePx(px);if(pp.whole)it.exchange=pp.whole==='以換代修';
    if(note)it.note=note;
    if(img)it.image=img;

  ${i.iws?vipHtml(i.iws,'iws'):''}
  ${i.vip?vipHtml(i.vip):''}
  ${D.general?`<h3>小米承諾</h3><ul>${D.general.promise.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p style="font-size:13px;color:var(--mut)">${esc(D.general.inspectionFee)}${esc(D.general.note)}</p>`:''}
  ${c.returnPolicy?.length?`<h3>退換修政策</h3><ul>${c.returnPolicy.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
  ${c.exclusions?.length?`<h3>不在保固範圍</h3><ul>${c.exclusions.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}
  <p><a href="${esc(c.url||'https://www.mi.com/tw/service/exchange/')}" target="_blank" rel="noopener">查看小米官網原文 ›</a></p>`;
  $('#sheet').classList.add('on')
}
$('#q').addEventListener('input',render);
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-b]');if(b){brand=b.dataset.b;render()}});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;brand='all';chips();render()}});
$('#list').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)detail(D.flat[+c.dataset.i])});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.classList.remove('on')});
$('#upd').addEventListener('click',async()=>{
  const b=$('#upd');b.disabled=true;b.textContent='更新中…';
  const before=new Set((D?.flat||[]).map(i=>i.name)),oldAt=D?.updatedAt;
  try{
    await load(true);
    const added=D.flat.filter(i=>!before.has(i.name)).map(i=>i.name);
    if(added.length){const s=added.slice(0,5).join('、')+(added.length>5?` 等 ${added.length} 項`:'');toast('發現新產品:'+s,7000)}
    else toast(D.sheetFrom==='live'?`已同步表格(${D.sheetRows} 列),沒有新增產品`:D.sheetFrom==='cache'||D.sheetFrom==='fail'?'讀不到 Google 表格,顯示的是上次的資料。請確認表格已「發布到網路」或設為知道連結的人可檢視。':D.updatedAt===oldAt?'目前已是最新資料(每週自動與小米官網同步)':'資料已更新,沒有新增產品')
  }catch(e){toast('無法取得最新資料,目前顯示的是上次的資料。')}
  b.disabled=false;b.textContent='↻ 更新';
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
load().catch(()=>{$('#meta').textContent='資料載入失敗'});
</script>
</body>
</html>
